name: Build APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build with Gradle
      run: ./gradlew assemblePlaystoreDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-playstore-debug
        path: presentation/build/outputs/apk/playstore/debug/presentation-playstore-debug.apk

    - name: Get latest version
      id: get_version
      uses: actions/github-script@v7
      with:
        script: |
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 1
          });
          
          let version = '1.0.0';
          if (releases.length > 0) {
            const latestVersion = releases[0].tag_name.replace('v', '');
            const [major, minor, patch] = latestVersion.split('.').map(Number);
            version = `${major}.${minor}.${patch + 1}`;
          }
          
          return version;

    - name: Create and push tag
      if: github.ref == 'refs/heads/develop'
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git tag -a "v${{ steps.get_version.outputs.result }}" -m "Auto release v${{ steps.get_version.outputs.result }}"
        git push origin "v${{ steps.get_version.outputs.result }}"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: presentation/build/outputs/apk/playstore/debug/presentation-playstore-debug.apk
        name: Release ${{ github.ref_name }}
        body: |
          Build from branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }} 
