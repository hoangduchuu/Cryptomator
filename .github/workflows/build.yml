name: Build APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build with Gradle
      run: ./gradlew assemblePlaystoreDebug

    - name: List build outputs
      run: |
        echo "Listing build outputs directory:"
        ls -R presentation/build/outputs/apk/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-playstore-debug
        path: presentation/build/outputs/apk/playstore/debug/presentation-playstore-debug.apk

    - name: Get latest version
      id: get_version
      uses: actions/github-script@v7
      with:
        script: |
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 1
          });
          
          let version = '1.0.0';
          if (releases.length > 0) {
            const latestVersion = releases[0].tag_name.replace('v', '');
            const [major, minor, patch] = latestVersion.split('.').map(Number);
            version = `${major}.${minor}.${patch + 1}`;
          }
          
          return version;

    - name: Check if tag exists
      id: check_tag
      run: |
        if git rev-parse --verify --quiet "refs/tags/v${{ steps.get_version.outputs.result }}"; then
          echo "Tag v${{ steps.get_version.outputs.result }} already exists, incrementing patch version"
          # Extract version components
          IFS='.' read -r major minor patch <<< "${{ steps.get_version.outputs.result }}"
          # Increment patch version
          new_patch=$((patch + 1))
          new_version="${major}.${minor}.${new_patch}"
          echo "new_version=${new_version}" >> $GITHUB_OUTPUT
        else
          echo "Tag v${{ steps.get_version.outputs.result }} does not exist, using it"
          echo "new_version=${{ steps.get_version.outputs.result }}" >> $GITHUB_OUTPUT
        fi

    - name: Create and push tag
      if: github.ref == 'refs/heads/develop'
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git tag -a "v${{ steps.check_tag.outputs.new_version }}" -m "Auto release v${{ steps.check_tag.outputs.new_version }}"
        git push origin "v${{ steps.check_tag.outputs.new_version }}"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: presentation/build/outputs/apk/playstore/debug/presentation-playstore-debug.apk
        name: Release ${{ github.ref_name }}
        body: |
          Build from branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }} 
